name: "BHI 10 · Halcyon Talent (the impostor)"

# Creates the Corporation of Halcyon Talent (demo), deploys its agent and
# onboards it with the devnet ECS Ecosystem. It gets NO Verified Employer
# credential and NO VERIFIER entry, by design: the refusal in the wallet
# depends on exactly those missing links.
# Verana V4 (devnet): select the v4 branch.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  halcyon:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: halcyon
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

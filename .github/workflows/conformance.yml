name: conformance
on:
  workflow_dispatch:
    inputs:
      casts:
        description: "casts that receive live mints"
        default: "demo,vesta,verandia,cexa,bhi"
      tier3:
        description: "also run tier 3 (conformance-tier3.yml, advisory until it has passed once)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: conformance-${{ github.ref }}

env:
  CONFORMANCE_NETWORK: testnet-v4

jobs:
  tier:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        tier: [t1, t2, t2-wwwallet]
    steps:
      - name: Check network secrets
        env:
          NAMESPACE_SECRET: ${{ secrets.K8S_NAMESPACE }}
        run: |
          if [ -z "$NAMESPACE_SECRET" ]; then
            echo "::error::Secret K8S_NAMESPACE is not set (see docs/networks.md)."
            exit 1
          fi
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            conformance/package-lock.json
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<'KUBEEOF'
          ${{ secrets.KUBECONFIG_VERANA_DEV }}
          KUBEEOF
          chmod 600 ~/.kube/config
      - name: Install the eudi-dev reference holder
        if: matrix.tier == 't2'
        env:
          EUDI_DEV_VERSION: v2.6.1
          EUDI_DEV_SHA256: 827e61d52fd4fbb534cd4277da6d065df0f8f9fc80c5e816e5a5da5751877c73
        run: |
          asset="eudi-${EUDI_DEV_VERSION}-linux-amd64"
          dir="$RUNNER_TEMP/eudi-dev"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/dominikschlosser/eudi-dev/releases/download/${EUDI_DEV_VERSION}"
          curl -fsSL --retry 3 -o checksums.txt "$base/checksums.txt"
          curl -fsSL --retry 3 -o "$asset" "$base/$asset"
          grep -qx "${EUDI_DEV_SHA256}  ${asset}" checksums.txt
          grep " ${asset}\$" checksums.txt | sha256sum -c -
          chmod +x "$asset"
          echo "EUDI_DEV_BIN=$dir/$asset" >> "$GITHUB_ENV"
      - run: npm ci
      - run: npm ci
        working-directory: conformance
      - name: Install headless Chromium for the wwWallet journeys
        if: matrix.tier == 't2-wwwallet'
        run: npx playwright-core install --with-deps --only-shell chromium
        working-directory: conformance
      - run: npm run ${{ matrix.tier }}
        working-directory: conformance
        continue-on-error: true
        env:
          CONFORMANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.tier }}
          CONFORMANCE_CASTS: ${{ matrix.tier == 't2-wwwallet' && 'bhi,cexa,verandia,vesta' || inputs.casts || 'demo,vesta,verandia,cexa,bhi' }}
          CONFORMANCE_MINTS: "1"
          CONFORMANCE_K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}
      - if: always()
        run: npm run summary >> "$GITHUB_STEP_SUMMARY"
        working-directory: conformance
      - name: wwWallet journeys summary
        if: always() && matrix.tier == 't2-wwwallet' && hashFiles('conformance/results/latest.json') != ''
        working-directory: conformance
        run: |
          {
            echo "## wwWallet journeys on ${CONFORMANCE_NETWORK}, headless with a virtual passkey"
            echo
            echo "| use case | service | step | outcome | wallet screen | cause |"
            echo "| --- | --- | --- | --- | --- | --- |"
            jq -r '.cells[] | select(.check == "wwwallet-journey") | [.cast, .service, .scenario, .outcome, (.evidence.screen // ""), ((.cause // "") | .[0:220])] | map(gsub("\\|"; "/")) | "| " + join(" | ") + " |"' results/latest.json
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: conformance-${{ matrix.tier }}-${{ env.CONFORMANCE_NETWORK }}
          path: conformance/results/
          retention-days: 90
          overwrite: true

  tier3:
    if: inputs.tier3
    uses: ./.github/workflows/conformance-tier3.yml
    with:
      network: testnet-v4
    secrets: inherit

  protocolsoup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    env:
      PROTOCOLSOUP_REF: v4.1.1
      PROTOCOLSOUP_SHA: 98621452523e74ede5f0bf909cdd0cd70f486f59
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch the pinned ProtocolSoup source
        run: |
          dir="$RUNNER_TEMP/protocolsoup"
          git init -q "$dir"
          git -C "$dir" fetch -q --depth 1 https://github.com/ParleSec/ProtocolSoup "$PROTOCOLSOUP_SHA"
          git -C "$dir" checkout -q FETCH_HEAD
          test "$(git -C "$dir" rev-parse HEAD)" = "$PROTOCOLSOUP_SHA"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ runner.temp }}/protocolsoup/backend/go.mod
          cache: false
      - name: Build the ProtocolSoup wallet harness
        working-directory: ${{ runner.temp }}/protocolsoup/backend
        run: |
          go build -trimpath -o "$RUNNER_TEMP/walletharness" ./cmd/walletharness
          echo "PROTOCOLSOUP_BIN=$RUNNER_TEMP/walletharness" >> "$GITHUB_ENV"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - run: npm ci
        working-directory: conformance
      - run: npm run t2:protocolsoup
        working-directory: conformance
        continue-on-error: true
        env:
          CONFORMANCE_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-protocolsoup
          CONFORMANCE_CASTS: ${{ inputs.casts || 'demo,vesta,verandia,cexa,bhi' }}
          CONFORMANCE_MINTS: "1"
      - name: Summary
        if: always() && hashFiles('conformance/results/latest.json') != ''
        working-directory: conformance
        run: |
          {
            echo "## ProtocolSoup reference holder ${PROTOCOLSOUP_REF}, non-gating"
            echo
            echo "| check | service | scenario | outcome | cause |"
            echo "| --- | --- | --- | --- | --- |"
            jq -r '.cells[] | select(.check | startswith("protocolsoup-")) | [.check, .service, .scenario, .outcome, ((.cause // "") | gsub("\\|"; "/") | .[0:220])] | "| " + join(" | ") + " |"' results/latest.json
            echo
            node --experimental-strip-types lib/gate.ts --services testnet-services.yaml --results results/latest.json | sed 's/^## Conformance gate:/## ProtocolSoup against testnet-services.yaml:/' || true
          } >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: protocolsoup-t2-${{ env.CONFORMANCE_NETWORK }}
          path: conformance/results/
          retention-days: 30
          overwrite: true

  gate:
    needs: [tier, tier3]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: conformance/package-lock.json
      - run: npm ci
        working-directory: conformance
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: conformance-t[12]-*
          path: current
      - if: needs.tier3.result != 'skipped'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: conformance-t3-*
          path: tier3
      - name: Tier 3, advisory until it has passed once
        if: needs.tier3.result != 'skipped'
        working-directory: conformance
        env:
          TIER3_RESULT: ${{ needs.tier3.result }}
        run: |
          args=(--services testnet-services.yaml)
          while IFS= read -r f; do args+=(--results "$f"); done < <(find ../tier3 -name latest.json 2> /dev/null)
          {
            echo "## Tier 3, advisory (${TIER3_RESULT})"
            echo
            if [ "${#args[@]}" -gt 2 ]; then
              node --experimental-strip-types lib/gate.ts "${args[@]}" | sed 's/^## Conformance gate:/### Tier 3 against testnet-services.yaml:/' || true
            else
              echo "No tier 3 results were produced."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Gate
        working-directory: conformance
        run: |
          args=(--services testnet-services.yaml --require-tier t1 --require-tier t2)
          while IFS= read -r f; do args+=(--results "$f"); done < <(find ../current -name latest.json)
          node --experimental-strip-types lib/gate.ts "${args[@]}" | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

name: "Demo 08 · Untrusted Verifier (demo)"

# Deploys the Untrusted Verifier (demo): deliberately unprovisioned (deploy-only, no credentials, no
# permissions) but running the openid4vc image so Track B wallets have an untrusted counterparty.
# Part of the Playground demo cast CI/CD — see .github/workflows/demo/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  demo-verifier-untrusted:
    uses: ./.github/workflows/demo-00_core.yml
    with:
      org: demo-verifier-untrusted
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

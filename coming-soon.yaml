# =============================================================================
# Verana Playground - open-source wallets from the FIDES catalog, not yet integrated
# =============================================================================
# These render greyed out inside the normal wallet grids, so a reader sees the
# whole open-source landscape and which parts of it already speak Verifiable
# Trust. Moving one from here into an integration is the whole roadmap.
#
# Source of truth, re-fetch to refresh:
#   https://raw.githubusercontent.com/FIDEScommunity/fides-wallet-catalog/main/data/aggregated.json
# Human-facing: https://fides.community/ecosystem-explorer/personal-wallets/
#
# Every repo and license below was verified against the GitHub API on
# 2026-08-03; entries whose repo could not be verified carry no repo link
# rather than a guess.
#
# Already integrated, so deliberately absent: Sphereon Edge Wallet, Hologram
# Messaging, Procivis One Wallet, Altme, EUDI Wallet Reference Implementation,
# Paradym Wallet, SWIYU Wallet, and Inji Certifier (integrations/mosip-inji).

personal:
  - id: nl-wallet
    name: NL Wallet
    vendor: Dutch Government
    logo: ./coming-soon/nl-wallet.png
    license: EUPL-1.2
    website: https://www.nldigitalgovernment.nl/
    repo: https://github.com/MinBZK/nl-wallet

  - id: bc-wallet
    name: BC Wallet
    vendor: Government of British Columbia
    logo: ./coming-soon/bc-wallet.png
    license: Apache-2.0
    website: https://www2.gov.bc.ca/gov/content/governments/government-id/bc-wallet
    repo: https://github.com/bcgov/bc-wallet-mobile
    note: Built on Credo, the same stack as Paradym - likely the shortest integration on this list.

  - id: eausweise
    name: eAusweise
    vendor: Austrian Government
    logo: ./coming-soon/eausweise.png

name: "Verandia 00 · Core (reusable)"

# Reusable deploy + provision pipeline for one member of the verandia cast. On
# the v4 branch the cast uses Verana V4 (devnet): this wrapper calls the
# generic V4 core (v4-cast-00_core.yml) with cast=verandia. It keeps the inputs
# of the verandia-0X workflows. force_refresh has no effect on V4: the agents
# get their credentials through onboarding processes, not by a re-issue.
# See .github/workflows/verandia/README.md.

on:
  workflow_call:
    inputs:
      org:
        description: "Cast member — must match a directory under .github/workflows/verandia/orgs/"
        required: true
        type: string
      step:
        description: "deploy | provision | all"
        required: false
        default: all
        type: string
      force_refresh:
        description: "No effect on V4 (kept for the callers)"
        required: false
        default: false
        type: boolean
      reset_identity:
        description: "DESTRUCTIVE - delete this org's statefulset and its volume so the agent boots with a brand new DID. Everything bound to the old DID has to be re-provisioned, so run with step=all."
        required: false
        default: false
        type: boolean

jobs:
  core:
    uses: ./.github/workflows/v4-cast-00_core.yml
    with:
      cast: verandia
      org: ${{ inputs.org }}
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

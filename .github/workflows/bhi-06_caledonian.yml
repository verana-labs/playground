name: "BHI 06 · Caledonian University (Qualification ecosystem)"

# Creates the Corporation of Caledonian University (demo), deploys its agent,
# onboards it with the devnet ECS Ecosystem, and creates its Ecosystem with
# the Qualification schema (verifiers through a GRANTOR), its ISSUER entry,
# the AnonCreds credential definition and the OpenID4VC issuer rail.
# Verana V4 (devnet): select the v4 branch.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  caledonian:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: caledonian
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

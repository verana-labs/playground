<!doctype html>
<meta charset="utf-8">
<title>Verana Proof of Trust</title>
<!--
  Proof-of-Trust card, HTML port of the Paradym wallet component
  (apps/easypid/src/features/wallet/VeranaTrustCard.tsx).

  Self-contained: no build step, no external asset. Drop it in, or lift the
  .pot-* rules and the markup into the playground / vs-agent default web.

  Data model is the ECS normalizer output (packages/sdk/src/trust/ecs.ts),
  which reads both the v3 claim names the testnet still serves and the v4 ones
  the published schemas define. Feed it via renderProofOfTrust(el, data).
-->
<style>
  .pot {
    --pot-ink: #111827; --pot-sub: #6b7280; --pot-line: #e5e7eb;
    --pot-ok: #16a34a; --pot-warn: #d97706; --pot-bad: #dc2626;
    --pot-brand: #5b21f6; --pot-chip: #f3f4f6;
    --pot-bg: #ffffff; --pot-panel: #f9fafb;
    font: 15px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    /* carry the background with the text colour: setting one without the other
       leaves light-on-light when the host page ignores the colour scheme */
    color: var(--pot-ink); background: var(--pot-bg);
    max-width: 26rem; padding: 1.25rem;
  }
  .pot h2 { font-size: 1.55rem; font-weight: 700; margin: 0 0 .9rem; letter-spacing: -.01em; }
  .pot-did { display: flex; align-items: center; gap: .5rem; margin-bottom: 1.4rem; }
  .pot-did code { font: 13px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--pot-sub);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pot-dot { width: .5rem; height: .5rem; border-radius: 50%; background: var(--pot-ok); flex: none; }

  /* the two identity checks, joined by a timeline rail */
  .pot-check { display: grid; grid-template-columns: 2rem 1fr; gap: .85rem; position: relative; padding-bottom: 1.5rem; }
  .pot-check:last-of-type { padding-bottom: 1rem; }
  .pot-check::before { content: ""; position: absolute; left: 1rem; top: 2rem; bottom: 0;
    width: 2px; background: var(--pot-line); }
  .pot-check:last-of-type::before { display: none; }
  .pot-tick { width: 2rem; height: 2rem; border-radius: 50%; display: grid; place-items: center;
    background: var(--pot-ok); color: #fff; font-size: .9rem; z-index: 1; }
  .pot-tick[data-state="fail"] { background: var(--pot-bad); }
  .pot-kicker { font-size: .7rem; font-weight: 700; letter-spacing: .08em; color: var(--pot-sub); }
  .pot-name { display: flex; align-items: center; gap: .45rem; font-size: 1.15rem; font-weight: 700; margin: .15rem 0; }
  .pot-logo { width: 2.5rem; height: 2.5rem; border-radius: .6rem; display: grid; place-items: center;
    color: #fff; font-weight: 700; font-size: .8rem; float: left; margin-right: .7rem; }
  .pot-muted { color: var(--pot-sub); }
  .pot-chip { display: inline-flex; align-items: center; gap: .35rem; background: var(--pot-chip);
    border-radius: .5rem; padding: .2rem .5rem; margin-top: .4rem; }
  .pot-chip b { font-size: .65rem; letter-spacing: .05em; color: var(--pot-sub); }

  .pot-verdict { display: inline-flex; align-items: center; gap: .5rem; border: 2px solid var(--pot-ok);
    border-radius: 999px; padding: .45rem .9rem; font-weight: 800; letter-spacing: .04em; color: var(--pot-ok); }
  .pot-verdict[data-v="PARTIAL"] { border-color: var(--pot-warn); color: var(--pot-warn); }
  .pot-verdict[data-v="UNTRUSTED"] { border-color: var(--pot-bad); color: var(--pot-bad); }
  .pot-note { margin: .55rem 0 1.3rem; font-size: .85rem; color: var(--pot-sub); }
  .pot-verdict[data-v="UNTRUSTED"] ~ .pot-note { color: var(--pot-bad); }

  .pot-conditions { background: var(--pot-panel); border-radius: .75rem; padding: .9rem 1rem; }
  .pot-conditions h3 { font-size: .68rem; font-weight: 700; letter-spacing: .08em;
    color: var(--pot-sub); margin: 0 0 .6rem; }
  .pot-cond { display: flex; align-items: center; gap: .5rem; padding: .3rem 0; }
  .pot-cond a { color: var(--pot-brand); font-weight: 600; text-decoration: none; }
  .pot-cond a:hover { text-decoration: underline; }
  .pot-digest { margin-left: auto; font-size: .75rem; color: var(--pot-sub); }
  .pot-digest[data-missing] { font-style: italic; }

  @media (prefers-color-scheme: dark) {
    .pot { --pot-ink: #f3f4f6; --pot-sub: #9ca3af; --pot-line: #374151;
           --pot-chip: #1f2937; --pot-bg: #0b1220; --pot-panel: #111827; }
  }
  :root[data-theme="light"] .pot { --pot-ink: #111827; --pot-sub: #6b7280; --pot-line: #e5e7eb;
           --pot-chip: #f3f4f6; --pot-bg: #ffffff; --pot-panel: #f9fafb; }
  :root[data-theme="dark"] .pot { --pot-ink: #f3f4f6; --pot-sub: #9ca3af; --pot-line: #374151;
           --pot-chip: #1f2937; --pot-bg: #0b1220; --pot-panel: #111827; }
</style>

<div id="pot-root"></div>

<script>
  // Deterministic stand-in for logoUri, which no testnet service publishes yet.
  const LOGO_TINTS = ["#2563eb", "#c2410c", "#059669", "#7c3aed", "#be123c"];
  const tint = (seed = "") =>
    LOGO_TINTS[[...seed].reduce((a, c) => a + c.charCodeAt(0), 0) % LOGO_TINTS.length];
  const initials = (name = "") =>
    name.split(/\s+/).filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();

  const flag = (cc) =>
    cc && /^[A-Za-z]{2}$/.test(cc)
      ? String.fromCodePoint(...[...cc.toUpperCase()].map((c) => 127397 + c.charCodeAt(0)))
      : "";

  const esc = (s) =>
    String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);

  const shortDid = (did = "") =>
    did.length > 46 ? `${did.slice(0, 28)}…${did.slice(-14)}` : did;

  // Every URI here comes from an ECS credential issued by the counterparty, so it is
  // attacker-controlled. Escaping alone would still let `javascript:` through in href
  // and `data:` through in src — the scheme has to be checked, not just the markup.
  const httpUrl = (u) => {
    try {
      const p = new URL(String(u));
      return p.protocol === "https:" || p.protocol === "http:" ? p.href : "";
    } catch {
      return "";
    }
  };

  function logo(name, url) {
    const src = httpUrl(url);
    if (src) return `<img class="pot-logo" src="${esc(src)}" alt="">`;
    const i = initials(name) || "?";
    return `<span class="pot-logo" style="background:${tint(name)}">${esc(i)}</span>`;
  }

  function condition(label, asset) {
    const href = httpUrl(asset?.uri);
    if (!href) return "";
    const digest = asset.digest
      ? `<span class="pot-digest">${esc(asset.digest.slice(0, 16))}…</span>`
      : `<span class="pot-digest" data-missing>no digest</span>`;
    return `<div class="pot-cond">🔒
      <a href="${esc(href)}" target="_blank" rel="noopener noreferrer">${esc(label)}</a>${digest}</div>`;
  }

  /**
   * @param {HTMLElement} el
   * @param {{did?:string, verdict:"TRUSTED"|"PARTIAL"|"UNTRUSTED", note?:string,
   *          evaluatedAtBlock?:number, service?:object, organization?:object}} d
   */
  function renderProofOfTrust(el, d) {
    const svc = d.service ?? {};
    const org = d.organization ?? {};
    const note = [d.note, d.evaluatedAtBlock ? `block ${d.evaluatedAtBlock.toLocaleString()}` : null]
      .filter(Boolean).join(" · ");

    el.className = "pot";
    el.innerHTML = `
      <h2>Verana Trust Registry</h2>
      ${d.did ? `<div class="pot-did"><span class="pot-dot"></span><code>${esc(shortDid(d.did))}</code></div>` : ""}

      <div class="pot-check">
        <span class="pot-tick" data-state="${svc.name ? "ok" : "fail"}">✓</span>
        <div>
          <div class="pot-kicker">SERVICE</div>
          ${logo(svc.name, svc.logo?.uri)}
          <div class="pot-name">${esc(svc.name ?? "Unverified service")}</div>
          ${svc.description ? `<div class="pot-muted">${esc(svc.description)}</div>` : ""}
        </div>
      </div>

      <div class="pot-check">
        <span class="pot-tick" data-state="${org.name ? "ok" : "fail"}">✓</span>
        <div>
          <div class="pot-kicker">OPERATED BY</div>
          ${logo(org.name, org.logo?.uri)}
          <div class="pot-name">${esc(org.name ?? "Unverified operator")} ${flag(org.countryCode)}</div>
          ${org.address ? `<div class="pot-muted">${esc(org.address)}</div>` : ""}
          ${org.registryId ? `<div class="pot-chip"><b>REG</b> ${esc(org.registryId)}</div>` : ""}
        </div>
      </div>

      <div class="pot-verdict" data-v="${esc(d.verdict)}">◈ ${esc(d.verdict)}</div>
      ${note ? `<div class="pot-note">${esc(note)}</div>` : ""}

      ${svc.terms || svc.privacy || svc.minimumAgeRequired != null ? `
        <div class="pot-conditions">
          <h3>CONDITIONS OF CONNECTING</h3>
          ${svc.minimumAgeRequired != null
            ? `<div class="pot-cond">ⓘ ${svc.minimumAgeRequired > 0
                ? `Minimum age ${svc.minimumAgeRequired}` : "No age restriction"}</div>` : ""}
          ${condition("Terms & conditions", svc.terms)}
          ${condition("Privacy policy", svc.privacy)}
        </div>` : ""}
    `;
  }

  window.renderProofOfTrust = renderProofOfTrust;

  // Demo payload: the shape the ECS normalizer produces.
  renderProofOfTrust(document.getElementById("pot-root"), {
    did: "did:webvh:QmZ9BT7AsWf62ubssns11KfiuauuoVk2v3zL8HYbGSFVTU:unfold-verifier.77.42.86.24.sslip.io",
    verdict: "TRUSTED",
    note: "Both identity checks verified against the Verana public registry",
    evaluatedAtBlock: 4586866,
    service: {
      name: "Unfold Verifier",
      description: "Unfold demonstration service",
      minimumAgeRequired: 0,
      terms: { uri: "https://verana-labs.github.io/governance-docs/EGF/example.pdf" },
      privacy: { uri: "https://verana-labs.github.io/governance-docs/EGF/example.pdf" },
    },
    organization: {
      name: "Verana Foundation",
      countryCode: "KY",
      address: "Grand Cayman, Cayman Islands",
      registryId: "KY-XXX.XXX.XXX",
    },
  });
</script>

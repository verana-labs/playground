name: "Vesta 04 · ISO Certification Ecosystem (demo)"

# Deploys the ISO Certification Ecosystem (demo): ECS credentials, the
# Ecosystem, the ISO 9001-style (demo) schema and its root Participant entry.
# Verana V4 (devnet): run it from the v4 branch. Part of the Vesta cast CI/CD;
# see .github/workflows/vesta/README.md for the run order.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  iso-certification:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: iso-certification
      step: ${{ inputs.step }}
    secrets: inherit

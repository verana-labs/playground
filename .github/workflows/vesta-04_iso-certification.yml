name: "Vesta 04 · ISO Certification Ecosystem (demo)"

# Deploys the certification registry and creates the ISO 9001-style (demo) schema + root permission.
# Part of the Vesta cast CI/CD — see .github/workflows/vesta/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  iso-certification:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: iso-certification
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

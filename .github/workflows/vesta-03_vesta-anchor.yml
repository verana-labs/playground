name: "Vesta 03 · Vesta Appliances anchor"

# Deploys the Vesta anchor: ECS-Organization from Helvetia, self ECS-Service, ECS-Badge issuer.
# Part of the Vesta cast CI/CD — see .github/workflows/vesta/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  vesta:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: vesta
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

name: "BHI 07 · Cirrus Certification (second Qualification issuer)"

# Creates the Corporation of Cirrus Certification (demo), deploys its agent,
# onboards it with the devnet ECS Ecosystem, and gets an ISSUER entry on the
# Qualification schema of Caledonian (bhi-06): one credential for each
# qualification, from any number of institutions.
# Verana V4 (devnet): select the v4 branch.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  cirrus:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: cirrus
      step: ${{ inputs.step }}
    secrets: inherit

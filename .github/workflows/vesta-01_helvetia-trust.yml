name: "Vesta 01 · Helvetia Trust (KYB issuer)"

# Deploys Helvetia Trust Services (demo) and bootstraps its ECS-Organization + ECS-Service.
# Part of the Vesta cast CI/CD — see .github/workflows/vesta/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  helvetia-trust:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: helvetia-trust
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96">
  <!-- Crypto Exchange Association (demo): exchange loop, member nodes,
       rising market - cast-badge variant of public/cexa/cexa-logo.svg -->
  <defs>
    <linearGradient id="cexaBadgeCandle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6ee7b7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <marker id="cexaBadgeArrow" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="3" markerHeight="3" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#fff"/>
    </marker>
  </defs>
  <rect width="96" height="96" rx="22" fill="#7c3aed"/>

  <!-- the exchange loop -->
  <path d="M 22 33 A 30 30 0 0 1 76.2 37.7" fill="none" stroke="#fff"
        stroke-width="5" stroke-linecap="round" marker-end="url(#cexaBadgeArrow)"/>
  <path d="M 74 63 A 30 30 0 0 1 19.8 58.3" fill="none" stroke="#fff"
        stroke-width="5" stroke-linecap="round" marker-end="url(#cexaBadgeArrow)"/>

  <!-- member nodes joining the loop -->
  <circle cx="77.9" cy="45.4" r="2.4" fill="#ddd6fe"/>
  <circle cx="77.5" cy="53.2" r="2.4" fill="#ddd6fe"/>
  <circle cx="18.1" cy="50.6" r="2.4" fill="#ddd6fe"/>
  <circle cx="18.5" cy="42.8" r="2.4" fill="#ddd6fe"/>

  <!-- the market inside: three rising candles -->
  <line x1="37" y1="44" x2="37" y2="64" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="33.5" y="48" width="7" height="12" rx="2" fill="url(#cexaBadgeCandle)"/>
  <line x1="48" y1="38" x2="48" y2="62" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="44.5" y="42" width="7" height="16" rx="2" fill="url(#cexaBadgeCandle)"/>
  <line x1="59" y1="32" x2="59" y2="58" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
  <rect x="55.5" y="36" width="7" height="18" rx="2" fill="url(#cexaBadgeCandle)"/>
</svg>

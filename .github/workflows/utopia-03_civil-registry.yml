name: "Utopia 03 · National Civil Registry (Citizen ID)"

# Deploys the National Civil Registry (demo) and creates the Utopia Citizen ID
# ecosystem — issuance AND verification governed.
# Part of the Utopia cast CI/CD — see .github/workflows/utopia/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  civil-registry:
    uses: ./.github/workflows/utopia-00_core.yml
    with:
      org: civil-registry
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

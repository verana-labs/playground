name: Release Please

# Opens and maintains a release PR from the Conventional Commits on main. When
# the release PR is merged, release-please creates a GitHub release and a v*
# tag, and this workflow publishes the images of that release: the site
# (publish.yml) and wwWallet (wwwallet.yml). They are called directly because
# a tag created with GITHUB_TOKEN starts no workflow by itself.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@5c625bfb5d1ff62eadeeb3772007f7f66fdcf071 # v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish-site:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/publish.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

  publish-wwwallet:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/wwwallet.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit

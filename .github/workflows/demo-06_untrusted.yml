name: "Demo 06 · Untrusted Service (demo)"

# Deploys the Untrusted Service (demo): deliberately unprovisioned (deploy-only, no credentials, no permissions).
# Part of the Playground demo cast CI/CD — see .github/workflows/demo/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  demo-untrusted:
    uses: ./.github/workflows/demo-00_core.yml
    with:
      org: demo-untrusted
      step: ${{ inputs.step }}
    secrets: inherit

name: "Vesta 09 · Zenith Repairs"

# Deploys Zenith: ECS credentials, the Authorized Repairer credential from
# Vesta Iberia, and ECS Badge issuer.
# CAUTION: the provision step needs vesta-08 (Vesta Iberia) first.
# Verana V4 (devnet): run it from the v4 branch. Part of the Vesta cast CI/CD;
# see .github/workflows/vesta/README.md for the run order.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  zenith:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: zenith
      step: ${{ inputs.step }}
    secrets: inherit

name: "BHI 04 · Better Hiring Institute (anchor + Recruitment Trust Network)"

# Creates the Corporation of the Better Hiring Institute, deploys its agent,
# onboards it with the devnet ECS Ecosystem, and creates the Recruitment Trust
# Network with its two schemas (Recognised RecTech Provider, Verified
# Employer in GRANTOR mode), their root entries and the Recognised RecTech
# Provider ISSUER entry of the Institute.
# Verana V4 (devnet): select the v4 branch.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  institute:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: institute
      step: ${{ inputs.step }}
    secrets: inherit

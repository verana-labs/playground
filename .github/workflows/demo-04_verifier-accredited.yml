name: "Demo 04 · Accredited Verifier (demo)"

# Deploys the Accredited Verifier (demo): delegated service + open VERIFIER Participant entry on the DemoCredential. Requires demo-01.
# Part of the Playground demo cast CI/CD — see .github/workflows/demo/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  demo-verifier-accredited:
    uses: ./.github/workflows/demo-00_core.yml
    with:
      org: demo-verifier-accredited
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

# =============================================================================
# Verana Playground - personal wallets configuration
# =============================================================================
# One entry per integrated personal wallet. The single /personal-wallets page
# is generated from this file: the wallet picker, the download section, the
# captures/videos, and the credential format used to mint the demo QR codes.
#
# To get listed: test the DemoCredential loop with AnonCreds and/or
# OpenID4VC SD-JWT (see the personal-wallet guideline), then open a PR with:
#   - your entry in this file
#   - wallets/<id>/ containing your icon (required) and optional screen
#     captures and videos
#
# Fields:
#   id              slug; must match the wallets/<id>/ directory
#   name            wallet display name
#   vendor          organization behind the wallet
#   icon            ./<id>/… path inside wallets/ (stored in this repo)
#   formats         credential formats the wallet passed the loop with:
#                   anoncreds | openid4vc-sdjwt (one or both)
#   verana_builtin  true when the standard published build supports Verana
#                   out of the box (no modified APK needed)
#   download        the Verana build: direct APK (modified build), or the
#                   store/web link when verana_builtin. Leave it out when the
#                   wallet has no Verana build
#   playstore/appstore/web   the store builds and the web wallet
#                   Each of these four links is one build. A plain URL is a
#                   build with the Verana trust screen; write
#                   {url, trust_screen: false} for one that completes the
#                   demos without it (it does not check the registry, so it
#                   does not refuse the unaccredited or untrusted services).
#                   Builds with the trust screen come first, the others after
#                   them, labelled. Every link must be the obtain of a listed
#                   build in conformance/profiles/<id>.yaml, and vice versa.
#                   A GitHub link (download, fork, repo) pins a release tag or
#                   a full commit, never a branch (exceptions, with an expiry,
#                   in conformance/listing-exceptions.yaml); a store link is
#                   canonical (no region); a host this repo deploys writes
#                   __NETWORK__
#   website         vendor website; the vendor name links to it (new tab)
#   repo, license, contact, notes
#   status          recommended | compatible | testing (testing when left out)
#                   recommended: a build with the Verana trust screen passes
#                   all six scenarios on device. The site lists only these,
#                   in file order (RI WG decision of 2026-11-11)
#                   compatible: completes the demos, short of that (e.g. a
#                   store build without the trust screen)
#                   testing: compatibility is not confirmed yet
#                   compatible and testing entries stay off the site
#   hidden          true          # keep the entry, icons and captures; drop it from the site until maintenance resumes
#   captures        up to ONE screen capture per demo scenario (optional),
#                   keyed by scenario id (issue-accredited,
#                   issue-unaccredited, issue-untrusted, present-accredited,
#                   present-unaccredited, present-untrusted); rendered inside
#                   the corresponding demo card
#   video           a single optional recording {src, note}, rendered in the
#                   Get-the-wallet section; note discloses recording
#                   conditions (speed, editing)

wallets:
  - id: hologram
    name: Hologram Messaging
    vendor: "2060"
    status: recommended
    icon: ./hologram/logo.webp
    formats: [anoncreds]
    download: https://play.google.com/store/apps/details?id=io.twentysixty.mobileagent.m
    playstore: https://play.google.com/store/apps/details?id=io.twentysixty.mobileagent.m
    appstore: https://apps.apple.com/app/hologram-messaging/id6474701855
    website: https://2060.io
    repo: https://github.com/2060-io/hologram-app
    license: Apache-2.0
    notes: Reference personal wallet, DemoCredential scenarios over AnonCreds/DIDComm. Q1 + Q2/Q3 and the trust chain card on both consent screens, built into the official app.
    captures:
      issue-accredited:
        src: ./hologram/screenshots/1.webp
        clip: ./hologram/clips/1-issuer-accredited.mp4
        caption: "Accredited issuer: identity verified, authorized for this credential, accept enabled"
      issue-unaccredited:
        src: ./hologram/screenshots/2.webp
        clip: ./hologram/clips/2-issuer-unaccredited.mp4
        caption: "Trusted but not accredited for this credential: Accept turns red and asks to accept anyway (unsafe)"
      issue-untrusted:
        src: ./hologram/screenshots/3.webp
        clip: ./hologram/clips/3-issuer-untrusted.mp4
        caption: "Untrusted issuer: claims not verified, on no Verana network, Accept asks to accept anyway (unsafe)"
      present-accredited:
        src: ./hologram/screenshots/4.webp
        clip: ./hologram/clips/4-verifier-accredited.mp4
        caption: "Accredited verifier: authorized to request this credential, and the presentation completes"
      present-unaccredited:
        src: ./hologram/screenshots/5.webp
        clip: ./hologram/clips/5-verifier-unaccredited.mp4
        caption: "Trusted but not authorized to request this credential: Share becomes Share anyway (unsafe)"
      present-untrusted:
        src: ./hologram/screenshots/6.webp
        clip: ./hologram/clips/6-verifier-untrusted.mp4
        caption: "Untrusted verifier: claims not verified, Share becomes Share anyway (unsafe)"
    video:
      src: ./hologram/demo.mp4
      note: Real device, live against the demo cast, offers and requests minted from this page's API. The six scenarios joined end to end, human-paced, silent, otherwise unedited. Scenario 1 stores the credential and scenario 4 presents that same credential back to the accredited verifier.


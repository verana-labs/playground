name: "Vesta 03 · Vesta Appliances anchor"

# Deploys the Vesta anchor: ECS credentials (ECS Organization from
# ecs-org-issuer, self-issued ECS Service), ECS Badge issuer, and the ISO
# 9001-style (demo) credential from NormaCert.
# CAUTION: the provision step needs vesta-04 and vesta-05 first.
# Verana V4 (devnet): run it from the v4 branch. Part of the Vesta cast CI/CD;
# see .github/workflows/vesta/README.md for the run order.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  vesta:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: vesta
      step: ${{ inputs.step }}
    secrets: inherit

name: "Verandia 02 · ECS accreditations (Business Registry)"

# Accredits the National Business Registry (demo) as an ISSUER of
# ECS-Organization — Business IDs from the register itself. The
# ECS-Organization schema is issuer-mode ECOSYSTEM, so the transaction must
# be signed by the ECS trust registry controller account — secret
# ECS_ECOSYSTEM_MNEMONIC. Run after "Verandia 01". Part of the Verandia cast
# CI/CD — see .github/workflows/verandia/README.md.

on:
  workflow_dispatch:

env:
  # The branch selects the network: v4 deploys to devnet, other branches to testnet.
  NETWORK: ${{ github.ref_name == 'v4' && 'devnet' || 'testnet' }}
  VERANAD_VERSION: v0.9.5
  USER_ACC: ecs-ecosystem-admin

jobs:
  accredit:
    name: Grant ECS permissions
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'v4' && 'devnet' || 'testnet' }}
    steps:
      # A run on a network other than testnet must use the secrets of its own
      # GitHub environment. This check stops the run when that environment is
      # not configured. See docs/networks.md.
      - name: Check network environment
        if: env.NETWORK != 'testnet'
        run: |
          if [ "${{ vars.NETWORK }}" != "$NETWORK" ]; then
            echo "::error::Environment '$NETWORK' is not configured. Set its variable NETWORK=$NETWORK and its secrets (see docs/networks.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install veranad
        run: |
          curl -sfL "https://github.com/verana-labs/verana-node/releases/download/${VERANAD_VERSION}/veranad-linux-amd64" \
            -o /usr/local/bin/veranad
          chmod +x /usr/local/bin/veranad
          veranad version

      - name: Import ECS ecosystem account
        run: |
          MNEMONIC="${{ secrets.ECS_ECOSYSTEM_MNEMONIC }}"
          if [ -z "$MNEMONIC" ]; then
            echo "::error::Secret ECS_ECOSYSTEM_MNEMONIC is not set. It must recover the ECS trust registry controller account."
            exit 1
          fi
          echo "$MNEMONIC" | veranad keys add "$USER_ACC" --recover --keyring-backend test
          echo "Imported account address: $(veranad keys show "$USER_ACC" -a --keyring-backend test)"

      - name: Grant accreditations
        run: |
          export CAST_DIR="${GITHUB_WORKSPACE}/.github/workflows/verandia"
          export VESTA_DIR="${GITHUB_WORKSPACE}/.github/workflows/vesta"
          bash "${CAST_DIR}/scripts/ecs-accreditations.sh"

      - name: Summary
        if: always()
        run: |
          echo "## ECS accreditations" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- National Business Registry: ISSUER permission on ECS-Organization" >> "$GITHUB_STEP_SUMMARY"

name: "Verandia 01 · National Business Registry (register)"

# Deploys the National Business Registry (demo): its Corporation, its ECS
# credentials (ECS Organization from ecs-org-issuer), the Legal Representation
# Ecosystem with the Legal Representative schema (issuers onboard through the
# Ecosystem, verifiers are OPEN), its own ISSUER entry and the AnonCreds
# credential definition. Run it first.
# Part of the Verandia cast CI/CD (Verana V4, devnet) — see .github/workflows/verandia/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  business-registry:
    uses: ./.github/workflows/verandia-00_core.yml
    with:
      org: business-registry
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

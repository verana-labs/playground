name: "BHI 09 · JobSearch (recognised verifier via the second grantor)"

# Creates the Corporation of JobSearch (demo), deploys its agent, onboards it
# with the devnet ECS Ecosystem, gets the Recognised RecTech Provider
# credential from the Institute, and gets VERIFIER entries on the three
# candidate schemas, validated by Trustworthy Verification Services (the
# openness argument). Run it after the second pass of bhi-03.
# Verana V4 (devnet): select the v4 branch.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  jobsearch:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: jobsearch
      step: ${{ inputs.step }}
    secrets: inherit

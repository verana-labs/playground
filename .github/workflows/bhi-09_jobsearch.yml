name: "BHI 09 · JobSearch (recognised verifier via the second grantor)"

# Deploys JobSearch (demo): ECS-Organization from Trustworthy Verification
# Services (the openness argument), the Recognised RecTech Provider
# credential from BHI, and VERIFIER permissions on the candidate schemas.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  jobsearch:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: jobsearch
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

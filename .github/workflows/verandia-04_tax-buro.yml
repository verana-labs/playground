name: "Verandia 04 · Tax Buro (relying party)"

# Deploys the tax portal of the Republic (demo): its Corporation, its ECS
# credentials, a VERIFIER entry on the Verandia Citizen ID (validated by the
# Civil Registry Corporation) and an OPEN VERIFIER entry on the Legal
# Representative schema. Requires verandia-01 and verandia-03.
# Part of the Verandia cast CI/CD (Verana V4, devnet) — see .github/workflows/verandia/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  tax-buro:
    uses: ./.github/workflows/verandia-00_core.yml
    with:
      org: tax-buro
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

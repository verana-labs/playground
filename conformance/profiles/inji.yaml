id: inji
rails: [openid4vc-sdjwt]
openid4vc:
  library: "io.inji:inji-vci-client-aar 1.0.0-alpha.2-SNAPSHOT (OpenID4VCI 1.0) and io.inji:inji-openid4vp-aar 1.0.0-alpha.2-verana.1 (OpenID4VP 1.0, DCQL, x509_hash client ids, ES256 requests, encrypted direct_post.jwt)"
  proxy: "@openid4vc/openid4vci, @openid4vc/openid4vp, @sd-jwt/sd-jwt-vc"
  vciDrafts: [v1]
  offerSchemes: [openid-credential-offer]
  requestSchemes: [openid4vp]
  asDiscovery: [oauth-authorization-server]
  presentation: { query: dcql, clientId: x509_hash, responseMode: direct_post.jwt }
  demoParams: signer=x5c
builds:
  - kind: fork
    listed: true
    networks: [devnet-v4]
    label: "Verana fork APK"
    obtain: https://github.com/AirKyzzZ/inji-wallet/releases/download/verana-2026-10-02/Inji_arm64-v8a.apk
    identity:
      package: io.mosip.residentapp
      version: verana-2026-10-02
      repo: https://github.com/AirKyzzZ/inji-wallet
      ref: verana-2026-10-02
    platforms: [android]
    promises: "Q1 card plus the Q2 issuer sentence and the Q3 verifier sentence. The affirmative control stays drawn on a denial. An issuer host already trusted skips consent entirely"
    device:
      activity: .MainActivity
      unlock: passcode
      secret: "123456"
      coldStart: true
quirks:
  actsOnLinkOnlyAtColdStart: true
  locksOnBackground: false
  viewTree: readable
  notes: "Drops a VIEW intent when idle at home, so force-stop before delivering; the biometric prompt sometimes stops responding to taps. MOSIP publishes no APK and no store listing, so the fork is the only installable build. The listed APK is upstream develop with the Verana port, device-tested on devnet 2026-10-02"

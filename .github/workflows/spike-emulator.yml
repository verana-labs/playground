name: spike-emulator

on:
  push:
    branches: [spike/emulator-tier3]
    paths:
      - ".github/workflows/spike-emulator.yml"
      - "spike/emulator/**"

concurrency:
  group: spike-emulator
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        include:
          - { wallet: eudi, delivery: link, camera: emulated }
          - { wallet: swiyu, delivery: link, camera: emulated }
          - { wallet: eudi, delivery: scan, camera: virtualscene }
          - { wallet: swiyu, delivery: scan, camera: virtualscene }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Enable KVM
        run: |
          grep -E '^(PRETTY_NAME|VERSION_ID)=' /etc/os-release
          echo "cpus $(nproc), virt flags $(grep -cE 'vmx|svm' /proc/cpuinfo)"
          ls -ld /etc/udev /etc/udev/rules /dev/kvm || true
          test -e /dev/kvm
          sudo chmod 666 /dev/kvm

      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disk-size: 6000M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back ${{ matrix.camera }}
          pre-emulator-launch-script: printf 'poster wall\nsize 2 2\nposition -0.807 0.320 5.316\nrotation 0 -150 0\ndefault poster.png\n\nposter table\nsize 1 1\nposition 0 0 -1.5\nrotation 0 0 0\n' > "$ANDROID_HOME/emulator/resources/Toren1BD.posters"
          disable-animations: true
          script: WALLET=${{ matrix.wallet }} DELIVERY=${{ matrix.delivery }} bash spike/emulator/probe.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: spike-emulator-${{ matrix.wallet }}-${{ matrix.delivery }}
          path: spike/emulator/out/
          retention-days: 7

name: "BHI 07 · Cirrus Certification (second Qualification issuer)"

# Deploys Cirrus Certification (demo): ECS creds and an ISSUER permission
# on the Qualification schema owned by Caledonian - one credential per
# qualification, from any number of institutions.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  cirrus:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: cirrus
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

    notes: The Dutch government's EUDI wallet, Flutter over a Rust core. The Verana trust card and accept gate sit on all three consent surfaces - login, disclosure, and issuance - with the real request origin threaded through, and the resolver checks run live against the testnet. Issuance against the demo cast is blocked one layer below Verana, in ETSI territory - the wallet core rejects any certificate chain that contains its own trust anchor, and the demo cast signs with a single self-signed leaf. That is a demo-PKI limitation rather than a trust-model one, so the six on-device captures land once the cast serves a two-level chain.

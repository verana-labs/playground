name: "Vesta 08 · Subsidiaries (Iberia + Nordics)"

# Deploys the two Vesta subsidiaries: ECS credentials and an ISSUER entry on
# the Authorized Repairer schema of the Vesta Repair Network.
# CAUTION: the provision step needs vesta-06 first.
# Verana V4 (devnet): run it from the v4 branch. Part of the Vesta cast CI/CD;
# see .github/workflows/vesta/README.md for the run order.

on:
  workflow_dispatch:
    inputs:
      subsidiary:
        description: "Which subsidiary to deploy"
        required: true
        type: choice
        options:
          - both
          - vesta-iberia
          - vesta-nordics
        default: both
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  vesta-iberia:
    if: inputs.subsidiary != 'vesta-nordics'
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: vesta-iberia
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

  # Runs after Iberia, never in parallel: both sign with the same operator
  # account, and two broadcasts at the same time race on its sequence number.
  vesta-nordics:
    needs: vesta-iberia
    if: >-
      !cancelled() &&
      inputs.subsidiary != 'vesta-iberia' &&
      (needs.vesta-iberia.result == 'success' || needs.vesta-iberia.result == 'skipped')
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: vesta-nordics
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

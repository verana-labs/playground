name: Deploy wwWallet

# One fork, one commit, N branded instances. Each directory of
# .github/workflows/wwwallet/brands/<brand>/ is an instance: brand.env
# carries the release name, hosts and wallet name; an optional branding/
# subdirectory is copied to wallet-frontend/branding/custom/ before the
# build (logos, favicon, theme; see the fork's branding/README.md). A push
# redeploys every instance; a dispatch deploys the chosen one.

on:
  workflow_dispatch:
    inputs:
      brand:
        description: "Instance to deploy: a directory of .github/workflows/wwwallet/brands/ (wwwallet = default, intexus = the INTEXUS wallet of /eventos)"
        default: "wwwallet"
      frontend_ref:
        description: "verana-labs/wallet-frontend ref to build (empty = v4 on the v4 branch, master otherwise)"
        default: ""
      backend_ref:
        description: "wwWallet/wallet-backend-server ref to build"
        default: "a92809bfa82ba2c23615b12f9307619b1e376cb0"
  push:
    branches: [main, v4]
    paths:
      - ".github/workflows/wwwallet.yml"
      - ".github/workflows/wwwallet/**"

concurrency:
  group: deploy-wwwallet-${{ github.ref_name == 'v4' && 'devnet' || 'testnet' }}
  cancel-in-progress: true

env:
  # The branch selects the network: v4 deploys to devnet, other branches to testnet.
  NETWORK: ${{ github.ref_name == 'v4' && 'devnet' || 'testnet' }}
  # The secrets of the v4 branch have this suffix (K8S_NAMESPACE_V4, PLAYGROUND_V4_MNEMONIC).
  SECRET_SUFFIX: ${{ github.ref_name == 'v4' && '_V4' || '' }}

jobs:
  backend:
    name: Build wwWallet backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wallet-backend-server
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wwWallet/wallet-backend-server
          ref: ${{ inputs.backend_ref || 'a92809bfa82ba2c23615b12f9307619b1e376cb0' }}
          path: wallet-backend-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: wallet-backend-server
          push: true
          # Only testnet moves the "latest" tag. Other networks use the network name.
          # (A comment inside the block below would become a tag.)
          tags: |
            veranalabs/wwwallet-backend:${{ github.sha }}
            veranalabs/wwwallet-backend:${{ env.NETWORK == 'testnet' && 'latest' || env.NETWORK }}
          cache-from: type=gha,scope=wwwallet-backend
          cache-to: type=gha,mode=max,scope=wwwallet-backend

  deploy:
    name: Build and deploy ${{ matrix.brand }}
    needs: backend
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.brand) || '["wwwallet", "intexus"]') }}
    steps:
      # The secrets of the v4 branch have the suffix _V4, so a devnet run never
      # uses the testnet namespace. Stop when the secret of this branch is empty.
      - name: Check network secrets
        env:
          NAMESPACE_SECRET: ${{ secrets[format('K8S_NAMESPACE{0}', env.SECRET_SUFFIX)] }}
        run: |
          if [ -z "$NAMESPACE_SECRET" ]; then
            echo "::error::Secret K8S_NAMESPACE${SECRET_SUFFIX} is not set (see docs/networks.md)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout wallet-frontend
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: verana-labs/wallet-frontend
          # The v4 branch of the fork runs the Verifiable Trust V4 checks (devnet).
          ref: ${{ inputs.frontend_ref || (github.ref_name == 'v4' && 'v4' || 'master') }}
          path: wallet-frontend

      - name: Load the brand
        run: |
          BRAND="${{ matrix.brand }}"
          BRAND_DIR=".github/workflows/wwwallet/brands/${BRAND}"
          if [ ! -f "${BRAND_DIR}/brand.env" ]; then
            echo "Unknown brand '${BRAND}': no ${BRAND_DIR}/brand.env" >&2
            exit 1
          fi
          # The hosts in brand.env use the __NETWORK__ placeholder.
          grep -v '^#' "${BRAND_DIR}/brand.env" | grep . | sed "s/__NETWORK__/${NETWORK}/g" >> "$GITHUB_ENV"

          # branding/custom is gitignored in the fork but not dockerignored, so
          # what we copy here is what the image ships.
          rm -rf wallet-frontend/branding/custom
          if [ -d "${BRAND_DIR}/branding" ]; then
            cp -R "${BRAND_DIR}/branding" wallet-frontend/branding/custom
            echo "Custom branding:"
            find wallet-frontend/branding/custom -type f | sort
          else
            echo "No custom branding: upstream wwWallet look"
          fi

          if [ "${BRAND}" = "wwwallet" ]; then
            TAG_PREFIX=""
            LATEST_TAG="latest"
          else
            TAG_PREFIX="${BRAND}-"
            LATEST_TAG="${BRAND}"
          fi
          # Only testnet moves the "latest" and brand tags. Other networks add the network name.
          if [ "$NETWORK" != "testnet" ]; then
            LATEST_TAG="${LATEST_TAG}-${NETWORK}"
          fi
          echo "FRONTEND_IMAGE=veranalabs/wwwallet-frontend:${TAG_PREFIX}${{ github.sha }}" >> "$GITHUB_ENV"
          echo "FRONTEND_LATEST=veranalabs/wwwallet-frontend:${LATEST_TAG}" >> "$GITHUB_ENV"
          echo "BACKEND_IMAGE=veranalabs/wwwallet-backend:${{ github.sha }}" >> "$GITHUB_ENV"

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<'KUBEEOF'
          ${{ secrets.KUBECONFIG_VERANA_DEV }}
          KUBEEOF

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.29.9'

      # A new network starts with no namespace. The kubeconfig user must have
      # the permission to create one; otherwise create it once by hand.
      - name: Ensure namespace
        env:
          NAMESPACE: ${{ secrets[format('K8S_NAMESPACE{0}', env.SECRET_SUFFIX)] }}
        run: |
          if kubectl get namespace "$NAMESPACE" > /dev/null 2>&1; then
            echo "Namespace exists"
          else
            kubectl create namespace "$NAMESPACE"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: wallet-frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}
            ${{ env.FRONTEND_LATEST }}
          cache-from: type=gha,scope=wwwallet-frontend-${{ matrix.brand }}
          cache-to: type=gha,mode=max,scope=wwwallet-frontend-${{ matrix.brand }}

      - name: Ensure wwwallet secrets
        run: |
          NAMESPACE="${{ secrets[format('K8S_NAMESPACE{0}', env.SECRET_SUFFIX)] }}"
          if ! kubectl -n "$NAMESPACE" get secret "${RELEASE}-secrets" >/dev/null 2>&1; then
            kubectl -n "$NAMESPACE" create secret generic "${RELEASE}-secrets" \
              --from-literal=APP_SECRET="$(openssl rand -hex 32)" \
              --from-literal=DB_PASSWORD="$(openssl rand -hex 24)"
          fi

      - name: Deploy wwWallet
        run: |
          export NAMESPACE="${{ secrets[format('K8S_NAMESPACE{0}', env.SECRET_SUFFIX)] }}"
          export DEPLOY_TS="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # RELEASE, HOST, API_HOST, WALLET_NAME, WALLET_TAGLINE come from brand.env;
          # FRONTEND_IMAGE and BACKEND_IMAGE from the brand step.

          envsubst '${NAMESPACE} ${RELEASE} ${FRONTEND_IMAGE} ${BACKEND_IMAGE} ${HOST} ${API_HOST} ${WALLET_NAME} ${WALLET_TAGLINE} ${DEPLOY_TS} ${NETWORK}' \
            < .github/workflows/wwwallet/manifests.yaml | kubectl apply -f -

          kubectl rollout status "statefulset/${RELEASE}-backend" -n "$NAMESPACE" --timeout=300s
          kubectl rollout status "deployment/${RELEASE}-frontend" -n "$NAMESPACE" --timeout=300s

      - name: Summary
        if: always()
        run: |
          echo "## ${WALLET_NAME} (${{ matrix.brand }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Wallet:** https://${HOST}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend:** https://${API_HOST}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend image:** ${FRONTEND_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend image:** ${BACKEND_IMAGE}" >> "$GITHUB_STEP_SUMMARY"

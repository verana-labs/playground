    vendor: Procivis
    icon: ./procivis/logo.webp
    formats: [openid4vc-sdjwt]
    download: https://github.com/AirKyzzZ/procivis-one-wallet-verana/releases/download/verana-2026-08-17/app-debug.apk
    website: https://www.procivis.ch
    repo: https://github.com/procivis/one-wallet
    fork: https://github.com/AirKyzzZ/one-wallet/tree/codex/procivis-verana
    license: Apache-2.0
    notes: Q1 and Q2/Q3 are resolved inside the Rust core, so the verdict is computed below the UI and the same trust card renders on both the offer and the presentation surface, with a full evidence dossier behind it. The two surfaces differ in force. Presentation is enforcing - nothing is sent to a verifier the registry refuses. Issuance is advisory - the card shows the refusal and disables accept, but the wallet fetches and stores the credential on arrival, before any verdict exists, and declining does not remove it. That is upstream behaviour we are working with Procivis on, not a Verana limitation.
    captures:
      issue-accredited:
        src: ./procivis/screenshots/1.webp
        clip: ./procivis/clips/1-issuer-accredited.mp4
        caption: "Accredited issuer: both identity credentials verified, authorized for this credential, and the credential lands in the wallet"

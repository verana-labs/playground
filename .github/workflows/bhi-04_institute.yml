name: "BHI 04 · Better Hiring Institute (anchor + Recruitment Trust Network)"

# Deploys the BHI anchor, bootstraps its ECS creds and creates the
# Recruitment Trust Network with its two schemas (Recognised RecTech
# Provider, Verified Employer).
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  institute:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: institute
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

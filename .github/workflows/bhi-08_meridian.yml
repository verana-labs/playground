name: "BHI 08 · Meridian Technologies (Verified Employer)"

# Creates the Corporation of Meridian Technologies (demo), deploys its agent,
# onboards it with the devnet ECS Ecosystem, gets the Verified Employer
# credential from Orchestrating Identity, and gets VERIFIER entries on the
# three candidate schemas, validated by Orchestrating Identity. Run it after
# the second pass of bhi-01.
# Verana V4 (devnet): select the v4 branch.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  meridian:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: meridian
      step: ${{ inputs.step }}
    secrets: inherit

name: "Vesta 01 · Helvetia Trust"

# Deploys Helvetia Trust Services (demo), a standalone organization. It gets its
# ECS Organization credential from ecs-org-issuer and issues its own ECS
# Service credential.
# Verana V4 (devnet): run it from the v4 branch. Part of the Vesta cast CI/CD;
# see .github/workflows/vesta/README.md for the run order.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  helvetia-trust:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: helvetia-trust
      step: ${{ inputs.step }}
    secrets: inherit

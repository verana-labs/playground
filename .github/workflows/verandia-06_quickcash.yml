name: "Verandia 06 · QuickCash Loans (over-asking verifier)"

# Deploys the over-asking verifier (demo): its Corporation and its ECS
# credentials only. By design it NEVER gets a VERIFIER entry on the Verandia
# Citizen ID. Run it after verandia-03, so that its request has a schema.
# Part of the Verandia cast CI/CD (Verana V4, devnet) — see .github/workflows/verandia/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  quickcash:
    uses: ./.github/workflows/verandia-00_core.yml
    with:
      org: quickcash
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

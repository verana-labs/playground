name: "Demo 01 · Playground Demo"

# Creates the cast Corporation, deploys the Playground Demo anchor, onboards it with the devnet ECS ecosystem, and creates the Playground Ecosystem (demo) + DemoCredential schema + root participant.
# Part of the Playground demo cast CI/CD — see .github/workflows/demo/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all

jobs:
  playground-demo:
    uses: ./.github/workflows/demo-00_core.yml
    with:
      org: playground-demo
      step: ${{ inputs.step }}
    secrets: inherit

name: "Demo 01 · Playground Demo"

# Deploys the Playground Demo anchor and creates the Playground Ecosystem (demo) + DemoCredential schema + root permission. Requires Helvetia (vesta-01) to be provisioned.
# Part of the Playground demo cast CI/CD — see .github/workflows/demo/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  playground-demo:
    uses: ./.github/workflows/demo-00_core.yml
    with:
      org: playground-demo
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

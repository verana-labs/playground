name: "Verandia 03 · National Civil Registry (Citizen ID)"

# Deploys the National Civil Registry (demo): its Corporation, its ECS
# credentials (ECS Organization from ecs-org-issuer), the Verandia Citizen ID
# Ecosystem (issuers AND verifiers onboard through the Ecosystem), its own
# ISSUER entry and the AnonCreds credential definition. Run it after verandia-01.
# Part of the Verandia cast CI/CD (Verana V4, devnet) — see .github/workflows/verandia/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  civil-registry:
    uses: ./.github/workflows/verandia-00_core.yml
    with:
      org: civil-registry
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

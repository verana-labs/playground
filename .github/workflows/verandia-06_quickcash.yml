name: "Verandia 06 · QuickCash Loans (over-asking verifier)"

# Deploys the over-asking verifier (demo): a verifiable company that is
# deliberately NEVER registered as a Citizen ID relying party.
# Part of the Verandia cast CI/CD — see .github/workflows/verandia/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  quickcash:
    uses: ./.github/workflows/verandia-00_core.yml
    with:
      org: quickcash
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

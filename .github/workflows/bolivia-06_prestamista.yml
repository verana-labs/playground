name: "Bolivia 06 · Prestamista (verificador no autorizado)"

# Deploys the over-asking verifier (demo): a verifiable company that is
# deliberately NEVER registered as a Cedula Digital relying party.
# Part of the Bolivia cast CI/CD — see .github/workflows/bolivia/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  prestamista:
    uses: ./.github/workflows/bolivia-00_core.yml
    with:
      org: prestamista
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

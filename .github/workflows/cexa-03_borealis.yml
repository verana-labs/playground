name: "CEXA 03 · Borealis Markets (VERIFIER)"

# Deploys Borealis Markets (demo): own ECS-Organization from Helvetia, validated VERIFIER
# permission on CEXA-Kyc, CEXA-VerifiedCounterparty from the Association. Requires cexa-01 and cexa-02
# (the OID4VC verifier pins the issuer fingerprints).
# Part of the CEXA cast CI/CD — see .github/workflows/cexa/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  borealis:
    uses: ./.github/workflows/cexa-00_core.yml
    with:
      org: borealis
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

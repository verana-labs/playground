name: "Bolivia 03 · SEGIP (Cedula Digital)"

# Deploys the SEGIP (demo) and creates the Cedula Digital
# ecosystem — issuance AND verification governed.
# Part of the Bolivia cast CI/CD — see .github/workflows/bolivia/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  segip:
    uses: ./.github/workflows/bolivia-00_core.yml
    with:
      org: segip
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

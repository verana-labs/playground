name: utopia-99 debug

on:
  workflow_dispatch:

env:
  K8S_NAMESPACE: ${{ secrets.K8S_NAMESPACE }}

jobs:
  inspect:
    name: inspect
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          cat > ~/.kube/config <<'KUBEEOF'
          ${{ secrets.KUBECONFIG_VERANA_DEV }}
          KUBEEOF

      - name: Install kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: 'v1.29.9'

      - name: Pods, events, capacity
        run: |
          NS="$K8S_NAMESPACE"
          echo "===== utopia pods ====="
          kubectl get pods -n "$NS" -o wide | grep -E "NAME|business-registry|civil-registry|tax-buro|meridian-bank|quickcash" || true
          echo "===== recent events (namespace) ====="
          kubectl get events -n "$NS" --sort-by=.lastTimestamp | tail -40 || true
          echo "===== describe one dead pod ====="
          POD=$(kubectl get pods -n "$NS" -o name | grep business-registry | head -1)
          [ -n "$POD" ] && kubectl describe -n "$NS" "$POD" | tail -40 || echo "no business-registry pod"
          echo "===== last container logs (business-registry) ====="
          [ -n "$POD" ] && kubectl logs -n "$NS" "$POD" --previous --tail=30 2>/dev/null || kubectl logs -n "$NS" "$POD" --tail=30 2>/dev/null || true
          echo "===== node allocation ====="
          kubectl describe nodes | grep -A7 "Allocated resources" || true

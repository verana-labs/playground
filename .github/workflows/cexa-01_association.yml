name: "CEXA 01 · Crypto Exchange Association (Ecosystem)"

# Deploys the Association agent: its Corporation, the ECS Organization credential from
# ecs-org-issuer, the self-issued ECS Service credential, the Ecosystem "Crypto Exchange
# Association (demo)" with the CEXAKycCredential schema (governed on both sides) and the
# CEXAVerifiedCounterpartyCredential schema, their root Participant entries, and the ISSUER entry
# of the Association on the counterparty schema. The chain keeps the digest of the EGF document:
# run Deploy Playground for devnet first, so that /cexa/cexa-egf-v4.md answers.
# Part of the CEXA cast CI/CD (Verana V4, devnet) — see .github/workflows/cexa/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  association:
    uses: ./.github/workflows/cexa-00_core.yml
    with:
      org: association
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

name: "BHI 03 · Trustworthy Verification Services (second grantor)"

# Creates the Corporation of Trustworthy Verification Services (demo), deploys
# its agent, onboards it with the devnet ECS Ecosystem, and gets its
# DVS-Aligned Provider credential from Orchestrating Identity (bhi-01). Run it
# again with step=provision after bhi-06: the second pass adds the Verified
# Employer branch and the VERIFIER_GRANTOR entries on the candidate schemas.
# Verana V4 (devnet): select the v4 branch.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  tvs:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: tvs
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

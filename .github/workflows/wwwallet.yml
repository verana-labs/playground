name: Publish wwWallet images

# Builds and publishes the wwWallet images of each playground release. One
# fork, one commit, N branded instances: each directory of
# .github/workflows/wwwallet/brands/<brand>/ is an instance, and an optional
# branding/ subdirectory is copied to wallet-frontend/branding/custom/ before
# the build (logos, favicon, theme; see the fork's branding/README.md).
#
# This repository only builds the images. verana-labs/verana-deploy deploys
# them (playground/versions.env pins the tags):
#   veranalabs/wwwallet-backend:<release tag>
#   veranalabs/wwwallet-frontend:<release tag>            (brand wwwallet)
#   veranalabs/wwwallet-frontend:<brand>-<release tag>    (other brands)

on:
  # Called by release-please.yml when it creates a release.
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to (re)build, for example v0.2.0"
        required: true
      frontend_ref:
        description: "verana-labs/wallet-frontend ref to build (empty = master)"
        default: ""
      backend_ref:
        description: "wwWallet/wallet-backend-server ref to build"
        default: "a92809bfa82ba2c23615b12f9307619b1e376cb0"

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag }}

jobs:
  backend:
    name: Build wwWallet backend image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout wallet-backend-server
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: wwWallet/wallet-backend-server
          ref: ${{ inputs.backend_ref || 'a92809bfa82ba2c23615b12f9307619b1e376cb0' }}
          path: wallet-backend-server

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push backend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: wallet-backend-server
          push: true
          tags: veranalabs/wwwallet-backend:${{ env.TAG }}
          cache-from: type=gha,scope=wwwallet-backend
          cache-to: type=gha,mode=max,scope=wwwallet-backend

  frontend:
    name: Build wwWallet frontend image (${{ matrix.brand }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        brand: [wwwallet]
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Checkout wallet-frontend
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: verana-labs/wallet-frontend
          # master runs the Verifiable Trust V4 checks. The frontend reads the
          # network at run time (VERANA_NETWORK in the deployment manifests).
          ref: ${{ inputs.frontend_ref || 'master' }}
          path: wallet-frontend

      - name: Load the brand
        run: |
          BRAND="${{ matrix.brand }}"
          BRAND_DIR=".github/workflows/wwwallet/brands/${BRAND}"
          if [ ! -f "${BRAND_DIR}/brand.env" ]; then
            echo "Unknown brand '${BRAND}': no ${BRAND_DIR}/brand.env" >&2
            exit 1
          fi
          # branding/custom is gitignored in the fork but not dockerignored, so
          # what we copy here is what the image ships.
          rm -rf wallet-frontend/branding/custom
          if [ -d "${BRAND_DIR}/branding" ]; then
            cp -R "${BRAND_DIR}/branding" wallet-frontend/branding/custom
            echo "Custom branding:"
            find wallet-frontend/branding/custom -type f | sort
          else
            echo "No custom branding: upstream wwWallet look"
          fi
          if [ "${BRAND}" = "wwwallet" ]; then
            echo "FRONTEND_IMAGE=veranalabs/wwwallet-frontend:${TAG}" >> "$GITHUB_ENV"
          else
            echo "FRONTEND_IMAGE=veranalabs/wwwallet-frontend:${BRAND}-${TAG}" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to container registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4.4.0
        with:
          username: ${{ secrets.DOCKER_HUB_LOGIN }}
          password: ${{ secrets.DOCKER_HUB_PWD }}

      - name: Build and push frontend image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: wallet-frontend
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}
          cache-from: type=gha,scope=wwwallet-frontend-${{ matrix.brand }}
          cache-to: type=gha,mode=max,scope=wwwallet-frontend-${{ matrix.brand }}

      - name: Summary
        if: always()
        run: |
          echo "## wwWallet ${{ matrix.brand }} @ ${TAG}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Frontend image:** ${FRONTEND_IMAGE}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Backend image:** veranalabs/wwwallet-backend:${TAG}" >> "$GITHUB_STEP_SUMMARY"

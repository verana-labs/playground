name: "BHI 10 · Halcyon Talent (the impostor)"

# Deploys Halcyon Talent (demo): a genuinely verifiable organisation with
# deliberately NO Verified Employer credential and NO verifier permissions -
# the wallet-side refusal depends on exactly those missing links.
# Part of the BHI cast CI/CD — see .github/workflows/bhi/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  halcyon:
    uses: ./.github/workflows/bhi-00_core.yml
    with:
      org: halcyon
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

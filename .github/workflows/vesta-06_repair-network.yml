name: "Vesta 06 · Vesta Repair Network"

# Deploys the Repair Network registry (delegated service) and creates the Authorized Repairer schema.
# Part of the Vesta cast CI/CD — see .github/workflows/vesta/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false

jobs:
  vesta-repair-network:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: vesta-repair-network
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
    secrets: inherit

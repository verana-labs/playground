name: "CEXA 03 · Novara Bank (ISSUER + VERIFIER)"

# Deploys Novara Bank (demo), the bank member of the corridor: its Corporation, its ECS
# credentials (ecs-org-issuer and self-issued), validated ISSUER and VERIFIER entries on the
# CEXAKycCredential, an AnonCreds credential definition, and a HOLDER entry with the
# CEXAVerifiedCounterpartyCredential from the Association. Requires cexa-01.
# Part of the CEXA cast CI/CD (Verana V4, devnet) — see .github/workflows/cexa/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  novara:
    uses: ./.github/workflows/cexa-00_core.yml
    with:
      org: novara
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

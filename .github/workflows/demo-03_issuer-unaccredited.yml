name: "Demo 03 · Unaccredited Issuer (demo)"

# Deploys the Unaccredited Issuer (demo): delegated trusted service, deliberately no DemoCredential Participant entry. Requires demo-01.
# Part of the Playground demo cast CI/CD — see .github/workflows/demo/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  demo-issuer-unaccredited:
    uses: ./.github/workflows/demo-00_core.yml
    with:
      org: demo-issuer-unaccredited
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

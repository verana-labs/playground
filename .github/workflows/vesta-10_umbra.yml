name: "Vesta 10 · Umbra Repairs (impostor)"

# Deploys the impostor: ECS credentials and ECS Badge issuer, but never an
# Authorized Repairer credential. The Vesta portal refuses its badges.
# Verana V4 (devnet): run it from the v4 branch. Part of the Vesta cast CI/CD;
# see .github/workflows/vesta/README.md for the run order.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  umbra:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: umbra
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

name: "Vesta 06 · Vesta Repair Network"

# Deploys the Vesta Repair Network, a delegated sub-service of Vesta: ECS
# Service credential from the Vesta anchor, the Ecosystem, the Authorized
# Repairer schema and its root Participant entry.
# CAUTION: needs vesta-03 first.
# Verana V4 (devnet): run it from the v4 branch. Part of the Vesta cast CI/CD;
# see .github/workflows/vesta/README.md for the run order.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  vesta-repair-network:
    uses: ./.github/workflows/vesta-00_core.yml
    with:
      org: vesta-repair-network
      step: ${{ inputs.step }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit

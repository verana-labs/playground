  - id: yivi
    name: Yivi
    vendor: Privacy by Design Foundation
    logo: ./coming-soon/yivi.png
    license: GPL-3.0
    website: https://yivi.app
    repo: https://github.com/privacybydesign/irmamobile
    note: Attribute-based credentials (Idemix), not OID4VC - a different rail from every wallet we have integrated so far.

  - id: wwwallet

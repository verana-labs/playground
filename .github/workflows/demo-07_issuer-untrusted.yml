name: "Demo 07 · Untrusted Issuer (demo)"

# Deploys the Untrusted Issuer (demo): deliberately unprovisioned (deploy-only, no credentials, no
# permissions) but running the openid4vc image so Track B wallets have an untrusted counterparty.
# Part of the Playground demo cast CI/CD — see .github/workflows/demo/README.md.

on:
  workflow_dispatch:
    inputs:
      step:
        description: "Which step to run"
        required: true
        type: choice
        options:
          - deploy
          - provision
          - all
        default: all
      force_refresh:
        description: "Re-issue credentials even when already linked"
        required: false
        type: boolean
        default: false
      reset_identity:
        description: "DESTRUCTIVE - wipe storage so the agent mints a new DID (use with step=all)"
        required: false
        type: boolean
        default: false

jobs:
  demo-issuer-untrusted:
    uses: ./.github/workflows/demo-00_core.yml
    with:
      org: demo-issuer-untrusted
      step: ${{ inputs.step }}
      force_refresh: ${{ inputs.force_refresh }}
      reset_identity: ${{ inputs.reset_identity }}
    secrets: inherit
